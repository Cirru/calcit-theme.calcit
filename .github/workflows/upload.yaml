name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Validate Calcit snapshot and type baseline
      run: |
        set -euo pipefail
        test ! -e compact.cirru
        test ! -e package.cirru
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --strict-types --check-only
        calcit calcit.cirru test --require-match
        calcit calcit.cirru analyze check-public --ns calcit-theme.main --ns calcit-theme.theme --ns calcit-theme.schema --ns calcit-theme.updater --ns calcit-theme.comp.expr --ns calcit-theme.comp.container --ns calcit-theme.types --ns calcit-theme.config --summary-only
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Build client with CDN asset URLs
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        fi
        export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
        calcit calcit.cirru js
        yarn vite build --base="$VITE_BASE_URL"
        node --test scripts/regression.test.mjs

    - name: Skip superseded production deployment
      id: deploy-head
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current=true
        if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
          latest_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            current=false
            echo "::notice::Skipping superseded production deployment; main HEAD has changed."
          fi
        fi
        echo "current=${current}" >> "$GITHUB_OUTPUT"

    - name: Upload and verify static assets on COS
      if: steps.deploy-head.outputs.current == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Install verified rsync
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error \
          --output "$RUNNER_TEMP/rsync.tar.gz" \
          https://download.samba.org/pub/rsync/src/rsync-3.5.0.tar.gz
        echo "c7ffd1ef653e99540f661e47cb00b7f9cad1ee6b972399b16f93d672656e0d33  $RUNNER_TEMP/rsync.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/rsync.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/rsync-3.5.0"
        ./configure --prefix="$RUNNER_TEMP/rsync-install" --disable-acl-support --disable-lz4 --disable-openssl --disable-xattr-support --disable-xxhash --disable-zstd
        make -j2
        make install
        echo "$RUNNER_TEMP/rsync-install/bin" >> "$GITHUB_PATH"

    - name: Configure verified SSH host
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        printf '%s\n' 'tiye.me ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfDrFyoH0+6TL2+xhosnON6f0+/m9Iz8ydJLWMQQzsm' > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"

    - name: Deploy web assets
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        rsync -avzr --progress \
          -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
          dist/* "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"
